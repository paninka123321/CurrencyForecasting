services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

  makemigrations:
    build:
      context: ./backend
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    restart: "no"
    entrypoint: ["/bin/sh", "-lc"]
    command: "alembic -c /app/alembic.ini revision --autogenerate -m 'initial'"

  migrate:
    build:
      context: ./backend
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    restart: "no"
    command: ["/bin/sh", "-lc", "alembic -c /app/alembic.ini upgrade head && python manage.py migrate --noinput"]

  backend:
    build:
      context: ./backend
    env_file: ./.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    command: ["gunicorn", "proj.wsgi:application", "--bind", "0.0.0.0:8000"]

  # worker:
  #   build:
  #     context: ./backend
  #   env_file: ./.env
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #   volumes:
  #     - ./backend:/app
  #   working_dir: /app
  #   environment:
  #     - PYTHONPATH=/app
  #   command: ["/bin/sh", "-c", "python fetcher/fetch_rates.py"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
    command: ["/bin/sh","-c","npm install && npm start"]

  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 2s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.9.3
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "yfinance pandas sqlalchemy psycopg2-binary python-dotenv"
      FOREX_DATABASE_URL: postgresql+psycopg2://forex:forex@db:5432/forexdb
      PYTHONPATH: /opt/airflow/app
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./backend:/opt/airflow/app
      - ./.env:/opt/airflow/app/.env
    command: ["bash", "-lc", "airflow db init && airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com"]

  airflow-webserver:
    image: apache/airflow:2.9.3
    depends_on:
      airflow-db:
        condition: service_healthy
    env_file: ./.env
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "yfinance pandas sqlalchemy psycopg2-binary python-dotenv"
      FOREX_DATABASE_URL: postgresql+psycopg2://forex:forex@db:5432/forexdb
      PYTHONPATH: /opt/airflow/app
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./backend:/opt/airflow/app
      - ./.env:/opt/airflow/app/.env
    command: ["bash", "-lc", "airflow webserver"]
    
  
  airflow-scheduler:
    image: apache/airflow:2.9.3
    depends_on:
      airflow-db:
        condition: service_healthy
    env_file: ./.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "yfinance pandas sqlalchemy psycopg2-binary python-dotenv"
      FOREX_DATABASE_URL: postgresql+psycopg2://forex:forex@db:5432/forexdb
      PYTHONPATH: /opt/airflow/app
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./backend:/opt/airflow/app
      - ./.env:/opt/airflow/app/.env
    command: ["bash", "-lc", "airflow scheduler"]

  # mlmodel:
  #   image: python:3.11-slim
  #   restart: "no"
  #   volumes:
  #     - ./ml:/ml
  #   command: ["/bin/sh","-c","sleep infinity"]

volumes:
  pgdata:
  airflow_pgdata:

networks: {}
